<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; background: #173b52; color: #173b52; }
    .cover { position: relative; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; }
    .photo { position: absolute; z-index: -3; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 51% 50%; filter: saturate(.94) contrast(1.04); }
    .shade { position: absolute; z-index: -2; inset: 0; background: linear-gradient(180deg, rgba(19,43,57,.10) 0%, rgba(19,43,57,.02) 43%, rgba(19,43,57,.58) 100%); }
    .panel { position: absolute; top: 470px; left: 72px; right: 72px; padding: 38px 42px 34px; border: 1px solid rgba(255,255,255,.80); border-radius: 30px; background: rgba(250,247,242,.93); box-shadow: 0 24px 65px rgba(17,43,58,.24); backdrop-filter: blur(16px); }
    .kicker { margin: 0 0 28px; color: #315f7a; font-size: 26px; line-height: 1; font-weight: 800; letter-spacing: 2px; }
    .accent { width: 112px; height: 9px; margin-bottom: 29px; border-radius: 9px; background: #e98872; }
    h1 { margin: 0; max-width: 820px; color: #173b52; font-family: Georgia, 'Times New Roman', serif; font-size: 71px; line-height: 1.08; letter-spacing: -1.1px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 34px; padding-top: 24px; border-top: 1px solid rgba(49,95,122,.22); }
    .brand img { width: 270px; height: 58px; object-fit: contain; object-position: left center; }
    .brand span { color: #5d7481; font-size: 22px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="cover">
    <img class="photo" src="carrossel/photo-05.png" alt="">
    <div class="shade"></div>
    <section class="panel">
      <p class="kicker">TDAH NO ADULTO</p>
      <div class="accent"></div>
      <h1>Por que o movimento pode ajudar a organizar a mente?</h1>
      <div class="brand">
        <img src="../../blog/assets/logo.png" alt="Dra. Débora Cury">
        <span>Conteúdo educativo</span>
      </div>
    </section>
  </main>
</body>
</html>
